<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="startContainer">
            <button id="start">Start</button>
        </div>
        <div class="timerContainer" id="d-none-one">
            <div id="timer">0</div>
            <div id="numeri">1,1,1,1,1</div>
        </div>
        <p class="indicazione" id="d-none-two">
            indicazione
        </p>

        <div class="containerNumeri"  id="d-none-two">
            <input type="text" id="num-1">
            <input type="text" id="num-2">
            <input type="text" id="num-3">
            <input type="text" id="num-4">
            <input type="text" id="num-5">
        </div>
        <div class="pulsante" id="d-none-two">
            <button id="conferma">
                prova
            </button>
        </div>
        <div class="outputContainer" id="d-none-three">
            <p id="punteggio">
                prova
            </p>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
