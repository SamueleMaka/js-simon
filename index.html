<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="startContainer">
            <button id="start">Start</button>
        </div>
        <div class="timerContainer">
            <div id="timer">0s</div>
            <div id="numeri"></div>
        </div>
        <p class="indicazione">
            Inserisci tutti i numeri che ricordi, l'ordine non è importante
        </p>
 
        <div class=" d-none" id="containerNumeri">
            <input type="text" id="num-1">
            <input type="text" id="num-2">
            <input type="text" id="num-3">
            <input type="text" id="num-4">
            <input type="text" id="num-5">
        </div>
        <div class="pulsante d-none">
            <button id="conferma">
                Invia
            </button>
        </div>
        <div class="outputContainer d-none">
            <p id="punteggio">
                
            </p>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
